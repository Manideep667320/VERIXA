services:
  - type: web
    name: evidence-to-action-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: OMP_NUM_THREADS
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://*.vercel.app
      - key: DATABASE_URL
        value: sqlite:///./data/evidence_to_action.db
      - key: CHROMA_PERSIST_DIR
        value: ./data/chroma_db
      - key: CONNECTOR_PROVIDER
        value: mock
      - key: APPROVAL_NOTIFIER
        value: mock
