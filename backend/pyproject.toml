[project]
name = "evidence-to-action"
version = "0.1.0"
description = "Evidence-to-Action Enterprise AI Agent — policy-aware, risk-controlled, evidence-backed workflow automation."
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Data validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # LLM
    "google-genai>=1.0.0",
    "openai>=1.50.0",
    # Vector store
    "chromadb>=0.5.0",
    # Database
    "aiosqlite>=0.20.0",
    # Document processing
    "pypdf>=4.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires explicitly configured Jira sandbox credentials"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
